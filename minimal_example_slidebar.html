        * {
            margin: 0;
            padding: 0;
        }
        html,
        body {

            background-color: rgb(255, 255, 255);
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
            color: rgb(98, 17, 50);

        header {
            background-color: #691c32;
            height: 5vh;
            width: 100vw;
            padding: 0;
            margin: 0;
            display: flex;
            align-items: center;
            color: #fff;
            font-size: 1.2rem;
            font-family: 'Montserrat', sans-serif !important;

        main {
            display: flex;
            height: 95vh;
            width: 100vw;

        .titulo_analisis {
            width: 10vw;
            text-align: center;
            font-size: 1.0rem;

        /* Aqui modificamos un tamaño de barra lateral */
        .sidebar {
            width: 10vw;
            /* Ajusta a gusto */
            height: 100%;
            background-color: #222d32;
            color: white;
            position: fixed;
            top: 5vh;
            /* debajo del header */
            transition: width 0.3s;
            overflow: hidden;
            font-family: 'Montserrat', sans-serif !important;
        }
    
        /* Aqui modificamos un tamaño de barra lateral para el colapso*/
        .sidebar.collapsed {
            width: 0vw;
        }
    
        .toggle-btn {
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            padding: 10px 15px;
            cursor: pointer;
            transition: transform 0.3s;
        }
    
        /* Rota el ícono cuando colapsa */
        .sidebar.collapsed .toggle-btn i {
            transform: rotate(180deg);
        }
    
    
        /* Aqui modificamos el tamaño del mapa  */
        .mapa_interfaz {
            margin-left: 10vw;
            height: 50%;
            height: 100%;
            width: calc(100vw - 10vw);
            transition: margin-left 0.3s, width 0.3s;
        }
    
        /* Aqui modificamos un tamaño de barra lateral para el colapso */
        .sidebar.collapsed+.mapa_interfaz {
            margin-left: 0vw;
            width: calc(100vw - 0vw);
        }
    
        main .sidebar.collapsed~.mapa_interfaz {
            margin-left: 0vw;
            width: calc(100vw - 0vw);
        }
    
    
    
        #map {
            height: 100%;
            width: 100%;
        }
    </style>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="codigos\JS\Cargar_Resumen.js"></script>
    <script>
        let chart;
        let Hist;

        // Slidebar 
        function toggleSidebar() {
            const sidebar = document.querySelector('.sidebar');
            sidebar.classList.toggle('collapsed');
        }
        //Esta es la que genera los cuatro graficos
        //Habrá que llamarla cada vez que se cambie el municipio (M), la colonia (C) o el incidente (I)
            MUNICIPIO="PACHUCA DE SOTO"
            COLONIA="CENTRO (Colonia)"
            INCIDENTE="OTRAS ALARMAS DE EMERGENCIAS ACTIVADAS (SEGURIDAD)"
        var mapa = L.map('map').setView([20.1, -98.7], 13);

                    //Capa base
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        maxZoom: 19,
                        attribution: '© OpenStreetMap'
                    }).addTo(mapa);
        let Mapa_Act;
        function Generar_Todo(M,C,I){
                    //MAPA primero
                    const filtrado = {
                        type: "FeatureCollection",
                        features: INFO.features.filter(feature => 
                            feature.properties.Municipio === M &&
                            //feature.properties.Colonia === C &&
                            feature.properties.Incidente === I
                        )
                    };
                    let colonia_act={
                        type: "FeatureCollection",
                        features: filtrado.features.filter(
                            feature => feature.properties.Colonia === C 
                        )
                    };
                    

                    if (Mapa_Act) {
                        mapa.removeLayer(Mapa_Act);
                    }
                    Mapa_Act=L.geoJSON(filtrado, {
                        pointToLayer: function (feature, latlng) {
                            // Crear el círculo y ajustar el radio según una propiedad (feature.properties)
                            return L.circleMarker(latlng, {
                                radius: feature.properties.Recuento * 0.1,
                                fillColor: "#ff7800",
                                color: "#000",
                                weight: 1,
                                opacity: 1,
                                fillOpacity: 0.8
                            });
                        },
                        onEachFeature: function (feature, layer) {
                            // Añadir un popup opcional si hay propiedades
                            if (feature.properties && feature.properties.Recuento) {
                                layer.bindPopup("<b>"+feature.properties.Colonia+"</b>"+"<br>"+"<b>" + feature.properties.Recuento + "</b>");
                            }
                        }
                    })
                    Mapa_Act.addTo(mapa);
                    const Colonia_feature = {
                        type: "FeatureCollection",
                        features: INFO.features.filter(feature => 
                            feature.properties.Municipio === M &&
                            feature.properties.Colonia === C
                        )
                    };
                    const datosParaGrafica = Colonia_feature.features.map(f => ({
                        categoria: f.properties.Incidente, // Extraemos la columna
                        valor: f.properties.Recuento          // Extraemos la columna
                    }));

                    const top10Datos = datosParaGrafica
                    .sort((a, b) => b.valor - a.valor) // Orden descendente
                    .slice(0, 10);

                    const ctx = document.getElementById('miTreemap').getContext('2d');
                    
                    if (chart) {
                        chart.destroy();
                    }
                    chart = new Chart(ctx, {
                        type: 'treemap',
                        data: {
                            datasets: [{
                                label: 'Incidentes en'+C,
                                // Usamos el arreglo que mapeamos anteriormente
                                tree: top10Datos, 
                                key: 'valor',
                                groups: ['categoria'],
                                spacing: 1,
                                borderWidth: 1,
                                borderColor: 'white',
                                labels: {
                                    display: true,
                                    formatter: (ctx) => {
                                        const data = ctx.raw._data;
                                        return [`${data.categoria}`, `Total: ${data.valor}`];
                                    },
                                    font: { size: 12, weight: 'bold' },
                                    color: 'white'
                                },
                                backgroundColor: (ctx) => {
                                    const colors = ['#4A0E4E', '#483D8B', '#3B5998', '#20B2AA', '#32CD32'];
                                    return colors[ctx.dataIndex % colors.length];
                                }
                            }]
                        },
                        options: {
                            plugins: {
                                legend: {
                                    display: false
                                },
                                tooltip: {
                                    callbacks: {
                                        label: (item) => ` Valor: ${item.raw.v}`
                                    }
                                },
                                title: {
                                    text: "Incidentes en "+C,
                                    display: true
                                }
                            },
                            maintainAspectRatio: false
                        }
                    });

                    //Puntos con regresión líneal
                    // 1. Datos iniciales de los puntos (Eje X e Y)
    const puntos = [
        { x: 1, y: 2 },
        { x: 2, y: 3.5 },
        { x: 3, y: 4 },
        { x: 4, y: 6.5 },
        { x: 5, y: 7 }
    ];

    // 2. Calcular la línea de tendencia (y = mx + b)
    // Para este ejemplo, usaremos una pendiente(m) de 1.2 y una intersección(b) de 1.0
    const m = 1.2; 
    const b = 1.0;

    const lineaRegresion = puntos.map(punto => ({
        x: punto.x,
        y: (m * punto.x) + b
    }));

    // 3. Crear el gráfico combinado
    const ctx2 = document.getElementById('miBarras').getContext('2d');
    if (Hist) {
        Hist.destroy();
    }
    Hist = new Chart(ctx2, {
        type: 'line', // Tipo base scatter
        data: {
            datasets: [
                {
                    label: 'Datos Experimentales',
                    data: puntos,
                    backgroundColor: 'rgba(255, 99, 132, 1)',
                    pointRadius: 6
                },
                {
                    label: 'Línea de Regresión',
                    data: lineaRegresion,
                    type: 'line', // Sobrescribimos a tipo línea para unir los puntos
                    showLine: true, // Forzamos que se dibuje la línea
                    fill: false,
                    borderColor: 'rgba(54, 162, 235, 1)',
                    borderWidth: 2,
                    pointRadius: 0 // Ocultamos los puntos de la línea
                }
            ]
        },
        options: {
            scales: {
                x: {
                    type: 'linear', 
                    title: { display: true, text: 'Mes y Año' } },
                y: { title: { display: true, text: 'Cantidad de Llamadas' } }
            }
        }
    });
                }
                
                //Leemos el resumen para el histórico
                let AñoXMes = [];
                ///Promesa. 
                tePrometoLeerExcel=new Promise((resolve,reject)=>{
                    fetch('outputs/llamadas9112025/Histórico_AñoXMes.xlsx') // Debe estar accesible públicamente (Qué se supone que significa eso?)
                        .then(response => {
                            if (!response.ok) {
                                throw new Error("No se pudo cargar el archivo Excel");
                            }
                            return response.arrayBuffer();
                        })
                        .then(data => {
                            try {
                                const workbook = XLSX.read(data, { type: 'array' });
                                const firstSheetName = workbook.SheetNames[0];
                                const worksheet = workbook.Sheets[firstSheetName];
                                AñoXMes = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
                            } catch (error) {
                                console.error("Error al procesar el Excel:", error);
                            }
                            resolve();
                        })
                        .catch(err => console.error("Error al cargar el archivo:", err));
                })
                tePrometoLeerExcel.then(()=>{
                    Rellenar_Colonia("TIZAYUCA")
                    //Rellenar_Incidente("TIZAYUCA","La Palma (Colonia)")
                })
                
                //Leemos para la Tabla de Calor
                let DiaXHora = [];

                fetch('outputs/llamadas9112025/Tabla_DiaXHora.xlsx') // Debe estar accesible públicamente (Qué se supone que significa eso?)
                    .then(response => {
                        if (!response.ok) {
                            throw new Error("No se pudo cargar el archivo Excel");
                        }
                        return response.arrayBuffer();
                    })
                    .then(data => {
                        try {
                            const workbook = XLSX.read(data, { type: 'array' });
                            const firstSheetName = workbook.SheetNames[0];
                            const worksheet = workbook.Sheets[firstSheetName];
                            DiaXHora = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
                        } catch (error) {
                            console.error("Error al procesar el Excel:", error);
                        }
                    })
                    .catch(err => console.error("Error al cargar el archivo:", err));

                //Colonia
                function Rellenar_Colonia(M){//M nos dirá el municipio que se ha escogido
                    MUNICIPIO=M;
                    const menu = document.getElementById("selector_colonia");
                    menu.innerHTML = ""; // Se supone que borra fácil TODAS las opciones del select

                    let filtrado_M=AñoXMes.filter(v => v[1] === M); //Lo hago con AñoXMes pero se puede hacer con cualquera de los dos xlsx
                    let lista_sucia= filtrado_M.map(fila => fila[0]); //Se repiten (por eso sucia jsjsj)
                    let lista = lista_sucia.filter((item, index) => lista_sucia.indexOf(item) === index); //Esto limpia como un unique

                    lista.forEach((colonia,i) => {
                        const opcion = document.createElement("option");
                        opcion.value = i+1;
                        opcion.text = colonia;
                        menu.appendChild(opcion);
                    });
                    let primera_colonia=document.getElementById('selector_colonia').options[document.getElementById('selector_colonia').selectedIndex].text;
                    Rellenar_Incidente(M,primera_colonia); //Como ya tenemos el tema ahora podemos llenar el Indicador
                }

                //Incidente
                function Rellenar_Incidente(M,C){//M nos dirá el municipio que se ha escogido
                    //y C la colonia elegida
                    COLONIA=C;
                    const menu = document.getElementById("selector_incidente");
                    menu.innerHTML = ""; // Se supone que borra fácil TODAS las opciones del select

                    let filtrado_M=AñoXMes.filter(v => v[1] === M); //Lo hago con AñoXMes pero se puede hacer con cualquera de los dos xlsx
                    let filtrado_M2=filtrado_M.filter(v => v[0] === C);
                    let lista_sucia= filtrado_M2.map(fila => fila[2]); //Se repiten (por eso sucia jsjsj)
                    let lista = lista_sucia.filter((item, index) => lista_sucia.indexOf(item) === index); //Esto limpia como un unique

                    lista.forEach((incidente,i) => {
                        const opcion = document.createElement("option");
                        opcion.value = i+1;
                        opcion.text = incidente;
                        menu.appendChild(opcion);
                    });
                    primer_incidente=document.getElementById('selector_incidente').options[document.getElementById('selector_incidente').selectedIndex].text;
                    Generar_Todo(M,C,primer_incidente)
                }
                
                

        // Mapa
        var map = L.map('map').setView([20.09004, -98.7679], 12);

        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

    </script>
